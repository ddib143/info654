<!DOCTYPE html>
<html>
<head>
<style> 
    body {font-family: Arial, Helvetica, sans-serif;}
   
    h1 {color:white;
        font-style: italic;
        font-size: 2.5em; 
    } 
   
     body {background-color: black; color: gray;}
    
    tr { 
        border-color: rgb(255, 255, 255); 
        border-style: solid; 
        } 

    tr { 
        border-color: rgb(255, 255, 255); 
        border-style: solid; 
        } 
    th { 
        background-color: #e1e5e7; color: rgb(8, 6, 6); 
        } 
    th, td {
        border-color: rgb(255, 255, 255); 
        border-style: solid; 
        padding: 10px;   
        border-radius: 25px;
        }

    /* unvisited link */
        a:link {
            color: #4c00ff;
        }
        /* visited link */
        a:visited {
            color: #4b305e;
        }
        /* mouse over link */
        a:hover {
            color: #FF00FF;
        }
        /* selected link */
        a:active {
            color: #ae00ff;
        }
    
       #h1heading {text-align: center;}


</style>
</head>
<body>
     <h1 id="h1heading">HELLO WORLD!</h1>
    <h2>WHAT A GREAT PAGE!</h2>
    <table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>Peter</td>
    <td>Griffin</td>
  </tr>
  <tr>
    <td>Lois</td>
    <td>Griffin</td>
  </tr>
</table>

</body>
</html>
